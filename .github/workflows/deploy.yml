name: Publicar Meu Dinheiro

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-meu-dinheiro"
  cancel-in-progress: true

env:
  STABLE_RELEASE: "1.0.0"
  BETA_LABEL: "1.1.0-beta.2"

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do desenvolvimento Beta
        uses: actions/checkout@v4

      - name: Checkout da versão Oficial congelada
        uses: actions/checkout@v4
        with:
          ref: stable
          path: _stable
          persist-credentials: false

      - name: Montar ambientes isolados
        run: python3 prepare_environments.py

      - name: Restaurar bytes originais dos ícones
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/8w2jh948cw-sudo/Controle-financeiro/stable/apple-touch-icon.png" -o /tmp/official-icon.png
          curl -fsSL "https://raw.githubusercontent.com/8w2jh948cw-sudo/Controle-financeiro/main/apple-touch-icon.png" -o /tmp/beta-icon.png
          cp /tmp/official-icon.png _site/apple-touch-icon.png
          cp /tmp/beta-icon.png _site/beta/apple-touch-icon.png

      - name: Preparar ferramentas de ícones
        run: python3 -m pip install --quiet pillow

      - name: Aplicar manual de estabilidade PWA
        run: |
          python3 -m py_compile manual_pwa_hardening.py
          python3 manual_pwa_hardening.py

      - name: Conferir arquitetura, dados, menu e ícones
        run: |
          set -e
          for file in \
            _site/index.html \
            _site/central.html \
            _site/menu.html \
            _site/menu/index.html \
            _site/diagnostico/index.html \
            _site/launch.html \
            _site/recover.html \
            _site/safe.html \
            _site/environment.json \
            _site/ambientes.json \
            _site/apple-touch-icon.png \
            _site/icons/apple-touch-icon.png \
            _site/icons/icon-192.png \
            _site/icons/icon-512.png \
            _site/icons/menu.svg \
            _site/icons/diagnostic.svg \
            _site/icons/launch.svg \
            _site/icons/recover.svg \
            _site/icons/safe.svg \
            _site/beta/index.html \
            _site/beta/launch.html \
            _site/beta/recover.html \
            _site/beta/safe.html \
            _site/beta/beta-tools.js \
            _site/beta/environment.json \
            _site/beta/apple-touch-icon.png \
            _site/beta/icons/apple-touch-icon.png \
            _site/beta/icons/icon-192.png \
            _site/beta/icons/icon-512.png \
            _site/beta/icons/launch.svg \
            _site/beta/icons/recover.svg \
            _site/beta/icons/safe.svg
          do
            test -s "$file"
          done

          # Oficial vem da branch stable; Beta vem da main e usa armazenamento próprio.
          grep -q 'app-environment.*official' _site/index.html
          grep -q 'app-environment.*beta' _site/beta/index.html
          grep -q 'meu-dinheiro-inteligente-beta' _site/beta/assets/*.js
          ! grep -q '"meu-dinheiro-inteligente-state"' _site/beta/assets/*.js
          cmp -s _site/apple-touch-icon.png /tmp/official-icon.png
          cmp -s _site/beta/apple-touch-icon.png /tmp/beta-icon.png
          ! cmp -s _site/apple-touch-icon.png _site/beta/apple-touch-icon.png

          # Durante desenvolvimento nenhum bundle registra novo Service Worker.
          ! grep -R -q 'serviceWorker.register' _site/assets _site/beta/assets
          grep -q 'Service Worker aposentado durante o desenvolvimento' _site/sw.js
          grep -q 'Service Worker aposentado durante o desenvolvimento' _site/beta/sw.js
          ! grep -q 'addEventListener("fetch"' _site/sw.js
          ! grep -q 'addEventListener("fetch"' _site/beta/sw.js

          # Menu é página independente: somente links, sem app shell, DB ou JavaScript.
          grep -q 'finance-tools-page.*menu' _site/menu.html
          grep -q 'repeat(2,minmax(0,1fr))' _site/menu.html
          ! grep -q '<script' _site/menu.html
          ! grep -q 'assets/' _site/menu.html
          ! grep -q 'app-shell' _site/menu.html
          ! grep -q 'id="root"' _site/menu.html

          # Boot resiliente e diagnóstico real.
          grep -q 'mdBootFallback' _site/index.html
          grep -q 'mdBootFallback' _site/beta/index.html
          grep -q 'Ambiente web' _site/index.html
          grep -q 'Interface funcional' _site/index.html
          grep -q 'Registros reais de SW' _site/diagnostico/index.html
          grep -q 'Caches reais' _site/diagnostico/index.html

          # Recuperação preserva dados e a Beta nunca toca no Oficial.
          grep -q 'Seus dados foram preservados' _site/recover.html
          grep -q 'NÃO toca no app Oficial\|Não toca no Oficial\|NÃO TOCA NO OFICIAL' _site/beta/recover.html _site/diagnostico/index.html
          ! grep -R -q 'localStorage.clear' _site/recover.html _site/beta/recover.html
          ! grep -R -q 'indexedDB.deleteDatabase' _site/recover.html _site/beta/recover.html

          # Manifestos devem abrir o próprio ambiente, com ícones 192/512 e apple-touch-icon 180.
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image

          root = Path('_site')
          for base in (root, root/'beta'):
              manifest = json.loads((base/'manifest.webmanifest').read_text(encoding='utf-8'))
              assert manifest['start_url'] == './'
              assert manifest['scope'] == './'
              sizes = {icon['sizes'] for icon in manifest['icons']}
              assert {'192x192', '512x512'} <= sizes
              assert Image.open(base/'icons/apple-touch-icon.png').size == (180, 180)
              assert Image.open(base/'icons/icon-192.png').size == (192, 192)
              assert Image.open(base/'icons/icon-512.png').size == (512, 512)
          print('Manifestos e dimensões de ícones validados.')
          PY

          # Todos os links internos do Menu e Diagnóstico precisam existir no artifact final.
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit

          root = Path('_site')
          pages = [root/'menu.html', root/'menu/index.html', root/'diagnostico/index.html']

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href: self.links.append(href)

          for page in pages:
              p = Links(); p.feed(page.read_text(encoding='utf-8'))
              for href in p.links:
                  if href.startswith(('http:', 'https:', 'mailto:', '#')): continue
                  clean = urlsplit(href).path
                  target = (page.parent / clean).resolve()
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.exists():
                      raise SystemExit(f'Link quebrado em {page}: {href} -> {target}')
          print('Todos os links internos do Menu e Diagnóstico foram validados.')
          PY

          echo "Manual validado: Oficial ${STABLE_RELEASE} preservado; Beta ${BETA_LABEL} isolada; SW desativado; menu independente; boot e ícones conferidos."

      - name: Habilitar e configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site completo
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
